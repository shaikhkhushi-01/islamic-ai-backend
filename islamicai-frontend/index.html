<!DOCTYPE html>
<html>
<head>
  <title>Islamic AI</title>
  <style>
    body { font-family: Arial; background: #f4f4f4; }
    #chat { width: 400px; margin: 50px auto; background: white; padding: 20px; border-radius: 10px; }
    #messages { height: 300px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; }
    input { width: 75%; padding: 10px; }
    button { padding: 10px; }
  </style>
</head>
<body>

<div id="chat">
  <h3>Islamic AI</h3>
  <div id="messages"></div>
  <input type="text" id="userInput" placeholder="Ask something..." />
  <button onclick="sendMessage()">Send</button>
</div>

<script>
async function sendMessage() {
  let input = document.getElementById("userInput").value;
  let messages = document.getElementById("messages");

  messages.innerHTML += "<p><b>You:</b> " + input + "</p>";

  let response = await fetch("https://islamicai-qqlp.onrender.com", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ question: input })
  });

  let data = await response.json();

  messages.innerHTML += "<p><b>AI:</b> " + data.answer + "</p>";
}
</script>

</body>
</html>
