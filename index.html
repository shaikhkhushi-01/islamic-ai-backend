<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Islamic AI</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#f2f2f2;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.chat-container{
    width:370px;
    height:620px;
    background:white;
    border-radius:20px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    box-shadow:0 0 20px rgba(0,0,0,0.15);
}

.header{
    background:#0f3d3e;
    color:white;
    padding:15px;
    text-align:center;
    font-weight:bold;
    position:relative;
}

.clear-btn{
    position:absolute;
    right:10px;
    top:10px;
    background:red;
    border:none;
    color:white;
    padding:5px 10px;
    border-radius:15px;
    cursor:pointer;
    font-size:12px;
}

.chat-box{
    flex:1;
    padding:10px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
}

.message{
    margin:6px 0;
    padding:8px 12px;
    border-radius:15px;
    max-width:80%;
}

.user{
    background:#cce5ff;
    align-self:flex-end;
}

.bot{
    background:#e9ecef;
    align-self:flex-start;
}

.input-area{
    display:flex;
    padding:10px;
    border-top:1px solid #ddd;
}

input{
    flex:1;
    padding:8px;
    border-radius:20px;
    border:1px solid #ccc;
    outline:none;
}

button{
    margin-left:8px;
    padding:8px 15px;
    border:none;
    background:#0f3d3e;
    color:white;
    border-radius:20px;
    cursor:pointer;
}

#related-topics button {
  margin: 5px;
  padding: 6px 12px;
  border-radius: 20px;
  border: none;
  background: #e0e0e0;
  cursor: pointer;
}

</style>
</head>

<body>

<div class="chat-container">

<div class="header">
<span style="font-size:18px;">🤖</span> Islamic AI Assistant
<button class="clear-btn" onclick="clearChat()">Clear</button>
</div>

<div class="chat-box" id="chatBox"></div>

<div class="input-area">
<input type="text" id="userInput" placeholder="Ask something..." onkeypress="handleEnter(event)">
<button onclick="sendMessage()">Send</button>
<button onclick="startVoice()">🎤</button>
</div>
<div id="related-topics"></div>
</div>

<script>

const token = localStorage.getItem("token");
const chatBox = document.getElementById("chatBox");

window.onload = loadHistory;

async function loadHistory(){
    try{
        const res = await fetch("https://islamic-ai-backend-b4z6.onrender.com/history",{
            headers:{
                "Authorization":"Bearer " + token
            }
        });

        if(res.status === 401){
            alert("Session expired. Please login again.");
            localStorage.removeItem("token");
            window.location.href="admin.html";
            return;
        }

        const data = await res.json();
        chatBox.innerHTML="";

        data.history.forEach(item=>{
            addMessage("user", item.question);
            addMessage("bot", item.answer);
        });

        chatBox.scrollTop = chatBox.scrollHeight;

    }catch(err){
        console.log(err);
    }
}

function addMessage(type,text){
    const div=document.createElement("div");
    div.className="message " + type;
    div.innerText=text;
    chatBox.appendChild(div);
}

async function sendMessage(){

    const input=document.getElementById("userInput");
    const message=input.value.trim();

    if(!message) return;

    addMessage("user",message);
    chatBox.scrollTop=chatBox.scrollHeight;

    input.value="";

    try{

    const res=await fetch("https://islamic-ai-backend-b4z6.onrender.com/chat",{
        method:"POST",
        headers:{
            "Content-Type":"application/json",
            "Authorization":"Bearer " + token
        },
        body:JSON.stringify({message:message})
    });

    if(res.status === 401){
        alert("Session expired.");
        localStorage.removeItem("token");
        window.location.href="admin.html";
        return;
    }

    if(!res.ok){
        addMessage("bot","Server waking up... please try again.");
        return;
    }

    const data = await res.json();

    const reply = data.reply || data.answer || data.response || data.message || "No response";

    addMessage("bot",reply);

    speak(reply);

    chatBox.scrollTop=chatBox.scrollHeight;

    }catch(err){

        addMessage("bot","Connection error. Try again.");

    }
}

async function clearChat(){

    await fetch("https://islamic-ai-backend-b4z6.onrender.com/clear",{
        method:"DELETE",
        headers:{
            "Authorization":"Bearer " + token
        }
    });

    chatBox.innerHTML="";
}

function handleEnter(e){
    if(e.key === "Enter"){
        sendMessage();
    }
}

function startVoice(){

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if(!SpeechRecognition){
        alert("Voice recognition not supported in this browser");
        return;
    }

    const recognition = new SpeechRecognition();

    recognition.lang="en-US";

    recognition.onresult=function(e){

        const text=e.results[0][0].transcript;

        document.getElementById("userInput").value=text;

        sendMessage();
    }

    recognition.start();
}

function speak(text){

    if(!window.speechSynthesis) return;

    const speech=new SpeechSynthesisUtterance(text);

    speech.lang="en-US";

    window.speechSynthesis.speak(speech);
}

</script>

</body>
</html>
