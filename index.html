<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Islamic AI Assistant</title>

<style>

/* =========================================================
   1. GLOBAL
========================================================= */

* {
    box-sizing: border-box;
}

:root {
    --primary: #0f3d3e;
    --primary-light: #14595a;
    --gold: #c9a227;

    --page-bg: #eef3f2;
    --chat-bg: #f7f9f9;
    --surface: #ffffff;

    --text: #1f2937;
    --muted: #6b7280;

    --user-bg: #d9eeee;
    --bot-bg: #ffffff;

    --border: #e1e8e8;

    --success: #198754;
    --danger: #c0392b;

    --shadow:
        0 20px 55px rgba(0, 0, 0, .18);
}

body.dark {
    --page-bg: #06191a;
    --chat-bg: #0b2021;
    --surface: #122a2b;

    --text: #f1f5f5;
    --muted: #a9bcbc;

    --user-bg: #124e50;
    --bot-bg: #183334;

    --border: #294748;

    --shadow:
        0 20px 60px rgba(0, 0, 0, .5);
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;

    font-family:
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

    background:
        linear-gradient(
            rgba(15, 61, 62, .94),
            rgba(15, 61, 62, .94)
        ),
        url("https://images.unsplash.com/photo-1564769625905-50e93615e769?q=80&w=1600&auto=format&fit=crop")
        center / cover fixed no-repeat;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;

    color: var(--text);
}


/* =========================================================
   2. MAIN CONTAINER
========================================================= */

.chat-container {
    width: min(100%, 480px);
    height: min(800px, 94vh);

    background: var(--surface);

    border-radius: 24px;

    overflow: hidden;

    display: flex;
    flex-direction: column;

    box-shadow: var(--shadow);

    border: 1px solid rgba(255,255,255,.15);
}


/* =========================================================
   3. HEADER
========================================================= */

.header {
    position: relative;

    background: var(--primary);

    color: white;

    text-align: center;

    padding: 17px 75px 16px;

    border-bottom: 3px solid var(--gold);
}

.header-title {
    font-size: 17px;
    font-weight: 700;
}

.header-subtitle {
    margin-top: 4px;

    font-size: 10px;

    opacity: .75;

    letter-spacing: .2px;
}

.header-btn {
    position: absolute;

    top: 14px;

    height: 34px;

    border: none;

    color: white;

    background: rgba(255,255,255,.12);

    cursor: pointer;

    transition: .2s;
}

.header-btn:hover {
    background: rgba(255,255,255,.22);
    transform: translateY(-1px);
}

.theme-btn {
    left: 14px;

    width: 34px;

    border-radius: 50%;
}

.clear-btn {
    right: 14px;

    padding: 0 12px;

    border-radius: 18px;

    font-size: 11px;
}


/* =========================================================
   4. CHAT AREA
========================================================= */

.chat-box {
    flex: 1;

    overflow-y: auto;

    padding: 18px 13px;

    background: var(--chat-bg);

    scroll-behavior: smooth;
}

.chat-box::-webkit-scrollbar {
    width: 6px;
}

.chat-box::-webkit-scrollbar-thumb {
    background: #9eb2b2;
    border-radius: 20px;
}


/* =========================================================
   5. WELCOME / EMPTY STATE
========================================================= */

.welcome {
    text-align: center;

    padding: 42px 20px;

    color: var(--muted);
}

.welcome-icon {
    width: 68px;
    height: 68px;

    margin: 0 auto 15px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 31px;

    background: rgba(15,61,62,.09);

    border: 1px solid rgba(15,61,62,.15);
}

.welcome h3 {
    margin: 0 0 8px;

    color: var(--text);

    font-size: 19px;
}

.welcome p {
    margin: 0 auto;

    max-width: 320px;

    font-size: 13px;

    line-height: 1.7;
}


/* =========================================================
   6. MESSAGE ROW
========================================================= */

.message-row {
    display: flex;

    align-items: flex-end;

    margin: 10px 0;

    animation: messageIn .25s ease;
}

.user-row {
    justify-content: flex-end;
}

.bot-row {
    justify-content: flex-start;
}

@keyframes messageIn {
    from {
        opacity: 0;
        transform: translateY(7px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* =========================================================
   7. AVATARS
========================================================= */

.avatar {
    width: 31px;
    height: 31px;

    flex: 0 0 31px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    margin: 0 7px;

    font-size: 14px;
}

.bot-avatar {
    background: var(--primary);
    color: white;
}

.user-avatar {
    background: #d4e7e7;
    color: var(--primary);
}


/* =========================================================
   8. MESSAGE BUBBLES
========================================================= */

.message {
    max-width: 79%;

    padding: 11px 14px;

    border-radius: 17px;

    font-size: 14px;

    line-height: 1.65;

    white-space: pre-wrap;

    overflow-wrap: anywhere;

    box-shadow:
        0 2px 8px rgba(0,0,0,.05);
}

.user-message {
    background: var(--user-bg);

    color: var(--text);

    border-bottom-right-radius: 5px;
}

.bot-message {
    background: var(--bot-bg);

    color: var(--text);

    border: 1px solid var(--border);

    border-bottom-left-radius: 5px;
}

.message-time {
    display: block;

    margin-top: 5px;

    font-size: 9px;

    color: var(--muted);

    text-align: right;
}


/* =========================================================
   9. ISLAMIC CONTENT FORMATTING
========================================================= */

.bot-message .quran-block,
.bot-message .hadith-block {
    display: block;

    margin-top: 8px;

    padding: 9px 10px;

    border-left: 3px solid var(--gold);

    background: rgba(201,162,39,.08);

    border-radius: 7px;
}

.reference-card {
    margin: 6px 40px;

    padding: 9px 12px;

    border-radius: 11px;

    background: rgba(201,162,39,.08);

    border: 1px solid rgba(201,162,39,.25);

    color: var(--text);

    font-size: 11px;

    line-height: 1.55;
}

.reference-card strong {
    color: var(--gold);
}


/* =========================================================
   10. INFO CARDS
========================================================= */

.info-card {
    margin: 5px 40px;

    padding: 8px 11px;

    border-radius: 10px;

    background: rgba(15,61,62,.06);

    border: 1px solid var(--border);

    color: var(--muted);

    font-size: 10px;

    line-height: 1.5;
}


/* =========================================================
   11. TYPING INDICATOR
========================================================= */

.typing {
    display: flex;

    align-items: center;

    gap: 5px;

    padding: 13px 15px;
}

.typing span {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: var(--primary);

    animation: typing 1.2s infinite;
}

.typing span:nth-child(2) {
    animation-delay: .15s;
}

.typing span:nth-child(3) {
    animation-delay: .30s;
}

@keyframes typing {
    0%, 60%, 100% {
        transform: translateY(0);
        opacity: .35;
    }

    30% {
        transform: translateY(-5px);
        opacity: 1;
    }
}


/* =========================================================
   12. RELATED TOPICS
========================================================= */

#related-topics {
    display: flex;

    align-items: center;

    gap: 7px;

    padding: 8px 11px;

    overflow-x: auto;

    white-space: nowrap;

    background: var(--surface);

    border-top: 1px solid var(--border);
}

#related-topics:empty {
    display: none;
}

.related-title {
    flex: 0 0 auto;

    color: var(--muted);

    font-size: 10px;
}

.related-btn {
    flex: 0 0 auto;

    margin: 0;

    padding: 6px 11px;

    border-radius: 16px;

    border: 1px solid var(--border);

    background: transparent;

    color: var(--text);

    cursor: pointer;

    font-size: 11px;

    transition: .2s;
}

.related-btn:hover {
    background: var(--primary);

    color: white;

    border-color: var(--primary);
}


/* =========================================================
   13. INPUT AREA
========================================================= */

.input-area {
    display: flex;

    align-items: center;

    gap: 7px;

    padding: 10px;

    background: var(--surface);

    border-top: 1px solid var(--border);
}

#userInput {
    flex: 1;

    min-width: 0;

    height: 42px;

    padding: 0 15px;

    border-radius: 22px;

    border: 1px solid var(--border);

    outline: none;

    background: var(--chat-bg);

    color: var(--text);

    font-size: 13px;

    transition: .2s;
}

#userInput::placeholder {
    color: var(--muted);
}

#userInput:focus {
    border-color: var(--primary);
}

.input-btn {
    width: 40px;
    height: 40px;

    flex: 0 0 40px;

    padding: 0;

    border: none;

    border-radius: 50%;

    background: var(--primary);

    color: white;

    cursor: pointer;

    transition: .2s;
}

.input-btn:hover {
    background: var(--primary-light);

    transform: translateY(-1px);
}

.send-btn {
    width: auto;

    padding: 0 16px;

    border-radius: 20px;
}


/* =========================================================
   14. MOBILE
========================================================= */

@media (max-width: 600px) {

    body {
        padding: 0;

        align-items: stretch;
    }

    .chat-container {
        width: 100%;
        height: 100vh;

        max-height: none;

        border-radius: 0;
    }

    .message {
        max-width: 84%;
    }

    .header {
        padding-top: 16px;
        padding-bottom: 16px;
    }
}

@media (max-width: 390px) {

    .send-btn {
        font-size: 0;

        width: 40px;

        padding: 0;
    }

    .send-btn::after {
        content: "➤";

        font-size: 15px;
    }

    .message {
        font-size: 13px;
    }
}

</style>
</head>


<body>

<div class="chat-container">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div class="header">

        <button
            class="header-btn theme-btn"
            id="themeButton"
            onclick="toggleTheme()"
            title="Toggle theme">
            🌙
        </button>

        <div class="header-title">
            🤖 Islamic AI Assistant
        </div>

        <div class="header-subtitle">
            Quran • Hadith • Islamic Knowledge
        </div>

        <button
            class="header-btn clear-btn"
            onclick="clearChat()">
            Clear
        </button>

    </div>


    <!-- =====================================================
         CHAT
    ====================================================== -->

    <div
        class="chat-box"
        id="chatBox">

        <div
            class="welcome"
            id="welcome">

            <div class="welcome-icon">
                🕌
            </div>

            <h3>
                Assalamu Alaikum
            </h3>

            <p>
                Ask me about Quran, Hadith,
                Salah, Ramadan, Dua,
                or Islamic guidance.
            </p>

        </div>

    </div>


    <!-- =====================================================
         RELATED TOPICS
    ====================================================== -->

    <div id="related-topics"></div>


    <!-- =====================================================
         INPUT
    ====================================================== -->

    <div class="input-area">

        <input
            type="text"
            id="userInput"
            placeholder="Ask something about Islam..."
            autocomplete="off"
            maxlength="2000"
            onkeypress="handleEnter(event)"
        >

        <button
            class="input-btn"
            onclick="startVoice()"
            title="Voice input">
            🎤
        </button>

        <button
            class="input-btn send-btn"
            onclick="sendMessage()"
            title="Send">
            Send
        </button>

    </div>

</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const API_URL =
    "https://islamic-ai-backend-b4z6.onrender.com";

const token =
    localStorage.getItem("token");

const chatBox =
    document.getElementById("chatBox");

const input =
    document.getElementById("userInput");

const relatedBox =
    document.getElementById("related-topics");

const themeButton =
    document.getElementById("themeButton");


/* =========================================================
   AUTH CHECK
========================================================= */

if (!token) {

    window.location.href = "login.html";
}


/* =========================================================
   LOAD
========================================================= */

window.addEventListener(
    "load",
    loadHistory
);


/* =========================================================
   TIME
========================================================= */

function getTime() {

    return new Date().toLocaleTimeString(
        [],
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}


/* =========================================================
   REMOVE WELCOME
========================================================= */

function removeWelcome() {

    const welcome =
        document.getElementById("welcome");

    if (welcome) {
        welcome.remove();
    }
}


/* =========================================================
   ADD MESSAGE
========================================================= */

function addMsg(text, type) {

    removeWelcome();

    const row =
        document.createElement("div");

    row.className =
        "message-row " +
        (
            type === "user"
                ? "user-row"
                : "bot-row"
        );


    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar " +
        (
            type === "user"
                ? "user-avatar"
                : "bot-avatar"
        );

    avatar.textContent =
        type === "user"
            ? "👤"
            : "🤖";


    const bubble =
        document.createElement("div");

    bubble.className =
        "message " +
        (
            type === "user"
                ? "user-message"
                : "bot-message"
        );


    /*
       textContent is intentionally used here.
       This prevents AI text from being interpreted
       as HTML.
    */

    bubble.textContent =
        text || "";


    const time =
        document.createElement("span");

    time.className =
        "message-time";

    time.textContent =
        getTime();


    bubble.appendChild(time);


    if (type === "user") {

        row.appendChild(bubble);

        row.appendChild(avatar);

    } else {

        row.appendChild(avatar);

        row.appendChild(bubble);
    }


    chatBox.appendChild(row);

    scrollBottom();
}


/* =========================================================
   INFO CARD
========================================================= */

function addInfo(text) {

    if (!text) return;

    const card =
        document.createElement("div");

    card.className =
        "info-card";

    card.textContent =
        text;

    chatBox.appendChild(card);

    scrollBottom();
}


/* =========================================================
   REFERENCE CARD
========================================================= */

function addReference(reference) {

    if (!reference) return;

    const card =
        document.createElement("div");

    card.className =
        "reference-card";


    const title =
        document.createElement("strong");

    title.textContent =
        "📖 Reference";


    const text =
        document.createElement("span");

    text.textContent =
        " " + reference;


    card.appendChild(title);

    card.appendChild(text);

    chatBox.appendChild(card);

    scrollBottom();
}


/* =========================================================
   TYPING
========================================================= */

function showTyping() {

    removeTyping();

    const row =
        document.createElement("div");

    row.id =
        "typingIndicator";

    row.className =
        "message-row bot-row";


    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar bot-avatar";

    avatar.textContent =
        "🤖";


    const bubble =
        document.createElement("div");

    bubble.className =
        "message bot-message typing";


    for (let i = 0; i < 3; i++) {

        const dot =
            document.createElement("span");

        bubble.appendChild(dot);
    }


    row.appendChild(avatar);

    row.appendChild(bubble);

    chatBox.appendChild(row);

    scrollBottom();
}


function removeTyping() {

    const typing =
        document.getElementById(
            "typingIndicator"
        );

    if (typing) {
        typing.remove();
    }
}


/* =========================================================
   SEND
========================================================= */

async function sendMessage() {

    const message =
        input.value.trim();

    if (!message) return;


    if (!token) {

        window.location.href =
            "login.html";

        return;
    }


    addMsg(
        message,
        "user"
    );


    input.value = "";

    relatedBox.innerHTML = "";


    showTyping();


    try {

        const response =
            await fetch(
                `${API_URL}/chat`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " + token
                    },

                    body: JSON.stringify({
                        message: message
                    })
                }
            );


        if (response.status === 401) {

            removeTyping();

            localStorage.removeItem(
                "token"
            );

            addMsg(
                "Your session has expired. Please login again.",
                "bot"
            );

            setTimeout(() => {

                window.location.href =
                    "login.html";

            }, 1200);

            return;
        }


        if (!response.ok) {

            removeTyping();

            addMsg(
                "The server is unavailable right now. Please try again in a moment.",
                "bot"
            );

            return;
        }


        const data =
            await response.json();


        removeTyping();


        const reply =
            data.reply ||
            "Sorry, I couldn't generate a response.";


        /* Answer */

        addMsg(
            reply,
            "bot"
        );


        /* Language */

        if (data.language) {

            addInfo(
                "🌍 Language: " +
                String(
                    data.language
                ).toUpperCase()
            );
        }


        /* Reference */

        if (data.reference) {

            addReference(
                data.reference
            );
        }


        /*
           Support both possible backend
           names: reference / references
        */

        if (
            !data.reference &&
            Array.isArray(data.references) &&
            data.references.length
        ) {

            data.references.forEach(
                reference => {

                    addReference(
                        reference
                    );
                }
            );
        }


        /* Confidence */

        if (data.confidence) {

            addInfo(
                "🎯 Confidence: " +
                data.confidence
            );
        }


        /* Source */

        if (data.source) {

            addInfo(
                "📚 Source: " +
                data.source
            );
        }


        /* Related */

        showRelated(
            data.related_topics || []
        );


        /* Voice */

        speakText(reply);


    } catch (error) {

        console.error(
            "Chat error:",
            error
        );

        removeTyping();

        addMsg(
            "Network error. Please check your internet connection and try again.",
            "bot"
        );
    }


    scrollBottom();
}


/* =========================================================
   RELATED TOPICS
========================================================= */

function showRelated(topics) {

    relatedBox.innerHTML = "";


    if (
        !Array.isArray(topics) ||
        topics.length === 0
    ) {
        return;
    }


    const title =
        document.createElement("span");

    title.className =
        "related-title";

    title.textContent =
        "Related:";


    relatedBox.appendChild(
        title
    );


    topics
        .slice(0, 8)
        .forEach(topic => {

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "related-btn";

            button.textContent =
                topic;


            button.onclick =
                () => {

                    input.value =
                        topic;

                    sendMessage();
                };


            relatedBox.appendChild(
                button
            );
        });
}


/* =========================================================
   HISTORY
========================================================= */

async function loadHistory() {

    if (!token) return;


    try {

        const response =
            await fetch(
                `${API_URL}/history`,
                {
                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        if (response.status === 401) {

            localStorage.removeItem(
                "token"
            );

            window.location.href =
                "login.html";

            return;
        }


        if (!response.ok) {

            return;
        }


        const data =
            await response.json();


        if (
            !data.history ||
            data.history.length === 0
        ) {

            return;
        }


        chatBox.innerHTML = "";


        data.history.forEach(item => {

            addMsg(
                item.question,
                "user"
            );

            addMsg(
                item.answer,
                "bot"
            );
        });


        scrollBottom();


    } catch (error) {

        console.error(
            "History error:",
            error
        );
    }
}


/* =========================================================
   CLEAR CHAT
========================================================= */

async function clearChat() {

    if (
        !confirm(
            "Are you sure you want to clear your chat history?"
        )
    ) {
        return;
    }


    try {

        const response =
            await fetch(
                `${API_URL}/clear`,
                {
                    method: "DELETE",

                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        if (response.status === 401) {

            localStorage.removeItem(
                "token"
            );

            window.location.href =
                "login.html";

            return;
        }


        chatBox.innerHTML = `
            <div class="welcome" id="welcome">

                <div class="welcome-icon">
                    🕌
                </div>

                <h3>
                    Chat Cleared
                </h3>

                <p>
                    Your conversation history
                    has been cleared.
                </p>

            </div>
        `;


        relatedBox.innerHTML = "";


    } catch (error) {

        addMsg(
            "Unable to clear chat right now.",
            "bot"
        );
    }
}


/* =========================================================
   ENTER
========================================================= */

function handleEnter(event) {

    if (
        event.key === "Enter"
    ) {

        event.preventDefault();

        sendMessage();
    }
}


/* =========================================================
   VOICE INPUT
========================================================= */

function startVoice() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        alert(
            "Voice input is not supported in this browser."
        );

        return;
    }


    const recognition =
        new SpeechRecognition();


    recognition.lang =
        "en-US";


    recognition.interimResults =
        false;


    recognition.maxAlternatives =
        1;


    recognition.onstart =
        () => {

            input.placeholder =
                "Listening...";
        };


    recognition.onend =
        () => {

            input.placeholder =
                "Ask something about Islam...";
        };


    recognition.onresult =
        event => {

            const transcript =
                event.results[0][0]
                    .transcript;

            input.value =
                transcript;

            sendMessage();
        };


    recognition.onerror =
        error => {

            console.log(
                "Voice recognition:",
                error
            );
        };


    recognition.start();
}


/* =========================================================
   VOICE OUTPUT
========================================================= */

function speakText(text) {

    if (
        !text ||
        !window.speechSynthesis
    ) {
        return;
    }


    window.speechSynthesis.cancel();


    const speech =
        new SpeechSynthesisUtterance(
            text
        );


    speech.lang =
        detectSpeechLanguage(text);


    speech.rate =
        .95;


    speech.pitch =
        1;


    window.speechSynthesis.speak(
        speech
    );
}


function detectSpeechLanguage(text) {

    if (
        /[\u0600-\u06FF]/.test(text)
    ) {
        return "ar-SA";
    }

    return "en-US";
}


/* =========================================================
   THEME
========================================================= */

function toggleTheme() {

    document.body.classList.toggle(
        "dark"
    );


    const isDark =
        document.body.classList.contains(
            "dark"
        );


    localStorage.setItem(
        "theme",
        isDark
            ? "dark"
            : "light"
    );


    updateThemeIcon(
        isDark
    );
}


function updateThemeIcon(isDark) {

    themeButton.textContent =
        isDark
            ? "☀️"
            : "🌙";
}


const savedTheme =
    localStorage.getItem(
        "theme"
    );


if (savedTheme === "dark") {

    document.body.classList.add(
        "dark"
    );

    updateThemeIcon(true);

} else {

    updateThemeIcon(false);
}


/* =========================================================
   SCROLL
========================================================= */

function scrollBottom() {

    requestAnimationFrame(
        () => {

            chatBox.scrollTop =
                chatBox.scrollHeight;
        }
    );
}


/* =========================================================
   FINAL UI SAFETY
========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        if (
            window.speechSynthesis
        ) {

            window.speechSynthesis.cancel();
        }
    }
);

</script>
