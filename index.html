<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Islamic AI Assistant</title>

<style>

/* =========================
   GLOBAL
========================= */

* {
    box-sizing: border-box;
}

:root {
    --primary: #0f3d3e;
    --primary-light: #14595a;
    --gold: #c9a227;

    --background: #eef3f2;
    --chat-bg: #f7f9f9;
    --white: #ffffff;

    --text: #1f2937;
    --muted: #6b7280;

    --user-bg: #d8eeee;
    --bot-bg: #ffffff;

    --border: #e2e8e8;

    --shadow:
        0 20px 50px rgba(0,0,0,.18);
}

body.dark {
    --background: #071a1b;
    --chat-bg: #0d2425;
    --white: #132b2c;

    --text: #f1f5f5;
    --muted: #a9bcbc;

    --user-bg: #124e50;
    --bot-bg: #183233;

    --border: #294546;

    --shadow:
        0 20px 60px rgba(0,0,0,.45);
}

body {
    margin: 0;
    min-height: 100vh;

    font-family:
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

    background:
        linear-gradient(
            rgba(15,61,62,.94),
            rgba(15,61,62,.94)
        ),
        url("https://images.unsplash.com/photo-1564769625905-50e93615e769?q=80&w=1200&auto=format&fit=crop")
        center/cover no-repeat;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}


/* =========================
   CHAT CONTAINER
========================= */

.chat-container {

    width: min(100%, 470px);

    height: min(760px, 94vh);

    background: var(--white);

    border-radius: 24px;

    display: flex;
    flex-direction: column;

    overflow: hidden;

    box-shadow: var(--shadow);

    border: 1px solid rgba(255,255,255,.15);
}


/* =========================
   HEADER
========================= */

.header {

    position: relative;

    background: var(--primary);

    color: white;

    padding: 18px 70px;

    text-align: center;

    border-bottom: 3px solid var(--gold);
}

.header-title {

    font-size: 17px;

    font-weight: 700;

    letter-spacing: .2px;
}

.header-subtitle {

    font-size: 11px;

    opacity: .75;

    margin-top: 4px;
}


/* =========================
   HEADER BUTTONS
========================= */

.header-btn {

    position: absolute;

    top: 15px;

    border: none;

    width: 34px;
    height: 34px;

    border-radius: 50%;

    color: white;

    background: rgba(255,255,255,.12);

    cursor: pointer;

    transition: .2s;
}

.header-btn:hover {

    background: rgba(255,255,255,.22);

    transform: translateY(-1px);
}

.theme-btn {

    left: 14px;
}

.clear-btn {

    right: 14px;

    font-size: 11px;

    width: auto;

    padding: 0 12px;

    border-radius: 18px;
}


/* =========================
   CHAT AREA
========================= */

.chat-box {

    flex: 1;

    padding: 18px 14px;

    overflow-y: auto;

    background: var(--chat-bg);

    scroll-behavior: smooth;
}

.chat-box::-webkit-scrollbar {

    width: 6px;
}

.chat-box::-webkit-scrollbar-thumb {

    background: #9bb2b2;

    border-radius: 10px;
}


/* =========================
   WELCOME MESSAGE
========================= */

.welcome {

    text-align: center;

    padding: 35px 20px;

    color: var(--muted);
}

.welcome-icon {

    width: 62px;
    height: 62px;

    margin: auto;

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 30px;

    background: rgba(15,61,62,.1);

    border: 1px solid rgba(15,61,62,.15);
}

.welcome h3 {

    margin: 14px 0 6px;

    color: var(--text);

    font-size: 18px;
}

.welcome p {

    margin: 0;

    font-size: 13px;

    line-height: 1.6;
}


/* =========================
   MESSAGE ROW
========================= */

.message-row {

    display: flex;

    margin: 10px 0;

    animation: messageIn .25s ease;
}

.message-row.user-row {

    justify-content: flex-end;
}

.message-row.bot-row {

    justify-content: flex-start;
}

@keyframes messageIn {

    from {
        opacity: 0;
        transform: translateY(6px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* =========================
   AVATAR
========================= */

.avatar {

    width: 32px;
    height: 32px;

    flex: 0 0 32px;

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    margin: 0 7px;

    font-size: 15px;
}

.bot-avatar {

    background: var(--primary);

    color: white;
}

.user-avatar {

    background: #d5e8e8;

    color: var(--primary);
}


/* =========================
   MESSAGE BUBBLE
========================= */

.message {

    max-width: 78%;

    padding: 11px 14px;

    border-radius: 17px;

    font-size: 14px;

    line-height: 1.6;

    white-space: pre-wrap;

    word-wrap: break-word;

    color: var(--text);

    box-shadow: 0 2px 8px rgba(0,0,0,.05);
}

.user-message {

    background: var(--user-bg);

    border-bottom-right-radius: 5px;
}

.bot-message {

    background: var(--bot-bg);

    border: 1px solid var(--border);

    border-bottom-left-radius: 5px;
}


/* =========================
   MESSAGE TIME
========================= */

.message-time {

    display: block;

    margin-top: 5px;

    font-size: 9px;

    color: var(--muted);

    text-align: right;
}


/* =========================
   INFO CARD
========================= */

.info-card {

    margin: 5px 42px;

    padding: 9px 12px;

    border-radius: 12px;

    background: rgba(15,61,62,.07);

    border: 1px solid var(--border);

    color: var(--muted);

    font-size: 11px;

    line-height: 1.5;
}


/* =========================
   TYPING INDICATOR
========================= */

.typing {

    display: flex;

    align-items: center;

    gap: 5px;

    padding: 13px 15px;
}

.typing span {

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: var(--primary);

    animation: typing 1.2s infinite;
}

.typing span:nth-child(2) {
    animation-delay: .15s;
}

.typing span:nth-child(3) {
    animation-delay: .30s;
}

@keyframes typing {

    0%, 60%, 100% {
        transform: translateY(0);
        opacity: .4;
    }

    30% {
        transform: translateY(-5px);
        opacity: 1;
    }
}


/* =========================
   RELATED TOPICS
========================= */

#related-topics {

    display: flex;

    gap: 7px;

    padding: 9px 12px;

    overflow-x: auto;

    white-space: nowrap;

    background: var(--white);

    border-top: 1px solid var(--border);
}

#related-topics:empty {

    display: none;
}

.related-title {

    font-size: 10px;

    color: var(--muted);

    align-self: center;

    flex: 0 0 auto;
}

.related-btn {

    width: auto;

    margin: 0;

    padding: 6px 11px;

    border-radius: 16px;

    border: 1px solid var(--border);

    background: transparent;

    color: var(--text);

    cursor: pointer;

    font-size: 11px;

    transition: .2s;
}

.related-btn:hover {

    background: var(--primary);

    color: white;

    border-color: var(--primary);
}


/* =========================
   INPUT AREA
========================= */

.input-area {

    display: flex;

    align-items: center;

    gap: 7px;

    padding: 11px;

    background: var(--white);

    border-top: 1px solid var(--border);
}

#userInput {

    flex: 1;

    min-width: 0;

    padding: 12px 15px;

    border-radius: 22px;

    border: 1px solid var(--border);

    outline: none;

    background: var(--chat-bg);

    color: var(--text);

    font-size: 13px;

    transition: .2s;
}

#userInput:focus {

    border-color: var(--primary);
}

.input-btn {

    width: 40px;
    height: 40px;

    flex: 0 0 40px;

    padding: 0;

    margin: 0;

    border: none;

    border-radius: 50%;

    background: var(--primary);

    color: white;

    cursor: pointer;

    transition: .2s;
}

.input-btn:hover {

    background: var(--primary-light);

    transform: translateY(-1px);
}

.send-btn {

    width: auto;

    padding: 0 17px;

    border-radius: 20px;
}


/* =========================
   RESPONSIVE
========================= */

@media (max-width: 600px) {

    body {

        padding: 0;

        align-items: stretch;
    }

    .chat-container {

        width: 100%;

        height: 100vh;

        max-height: none;

        border-radius: 0;
    }

    .message {

        max-width: 84%;
    }

    .header {

        padding-top: 16px;
        padding-bottom: 16px;
    }
}

</style>
</head>


<body>

<div class="chat-container">

    <!-- HEADER -->

    <div class="header">

        <button
            class="header-btn theme-btn"
            onclick="toggleTheme()"
            title="Toggle theme">
            🌙
        </button>

        <div class="header-title">
            🤖 Islamic AI Assistant
        </div>

        <div class="header-subtitle">
            Quran • Hadith • Islamic Guidance
        </div>

        <button
            class="header-btn clear-btn"
            onclick="clearChat()">
            Clear
        </button>

    </div>


    <!-- CHAT -->

    <div
        class="chat-box"
        id="chatBox">

        <div
            class="welcome"
            id="welcome">

            <div class="welcome-icon">
                🕌
            </div>

            <h3>
                Assalamu Alaikum
            </h3>

            <p>
                Ask me about Quran, Hadith,
                Salah, Ramadan, Dua or
                Islamic guidance.
            </p>

        </div>

    </div>


    <!-- RELATED -->

    <div id="related-topics"></div>


    <!-- INPUT -->

    <div class="input-area">

        <input
            type="text"
            id="userInput"
            placeholder="Ask something about Islam..."
            autocomplete="off"
            onkeypress="handleEnter(event)"
        >

        <button
            class="input-btn"
            onclick="startVoice()"
            title="Voice input">
            🎤
        </button>

        <button
            class="input-btn send-btn"
            onclick="sendMessage()">
            Send
        </button>

    </div>

</div>


<script>

/* =========================
   CONFIG
========================= */

const API_URL =
    "https://islamic-ai-backend-b4z6.onrender.com";

const token =
    localStorage.getItem("token");

const chatBox =
    document.getElementById("chatBox");

const input =
    document.getElementById("userInput");

const relatedBox =
    document.getElementById("related-topics");


/* =========================
   INITIAL LOAD
========================= */

window.addEventListener(
    "load",
    loadHistory
);


/* =========================
   ADD MESSAGE
========================= */

function addMsg(
    text,
    type
) {

    const welcome =
        document.getElementById("welcome");

    if (welcome) {
        welcome.remove();
    }


    const row =
        document.createElement("div");

    row.className =
        "message-row " +
        (type === "user"
            ? "user-row"
            : "bot-row");


    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar " +
        (type === "user"
            ? "user-avatar"
            : "bot-avatar");

    avatar.innerText =
        type === "user"
            ? "👤"
            : "🤖";


    const bubble =
        document.createElement("div");

    bubble.className =
        "message " +
        (type === "user"
            ? "user-message"
            : "bot-message");

    bubble.innerText =
        text;


    const time =
        document.createElement("span");

    time.className =
        "message-time";

    time.innerText =
        new Date().toLocaleTimeString(
            [],
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );


    bubble.appendChild(time);


    if (type === "user") {

        row.appendChild(bubble);

        row.appendChild(avatar);

    } else {

        row.appendChild(avatar);

        row.appendChild(bubble);

    }


    chatBox.appendChild(row);

    scrollBottom();
}


/* =========================
   INFO MESSAGE
========================= */

function addInfo(text) {

    const card =
        document.createElement("div");

    card.className =
        "info-card";

    card.innerText =
        text;

    chatBox.appendChild(card);

    scrollBottom();
}


/* =========================
   TYPING
========================= */

function showTyping() {

    const row =
        document.createElement("div");

    row.id =
        "typingIndicator";

    row.className =
        "message-row bot-row";


    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar bot-avatar";

    avatar.innerText =
        "🤖";


    const bubble =
        document.createElement("div");

    bubble.className =
        "message bot-message typing";


    bubble.innerHTML =
        "<span></span>" +
        "<span></span>" +
        "<span></span>";


    row.appendChild(avatar);

    row.appendChild(bubble);

    chatBox.appendChild(row);

    scrollBottom();
}


function removeTyping() {

    const typing =
        document.getElementById(
            "typingIndicator"
        );

    if (typing) {
        typing.remove();
    }
}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage() {

    const message =
        input.value.trim();

    if (!message) return;


    addMsg(
        message,
        "user"
    );

    input.value = "";

    relatedBox.innerHTML = "";

    showTyping();


    try {

        const response =
            await fetch(
                `${API_URL}/chat`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " + token
                    },

                    body: JSON.stringify({
                        message: message
                    })
                }
            );


        if (response.status === 401) {

            removeTyping();

            alert(
                "Session expired. Please login again."
            );

            localStorage.removeItem(
                "token"
            );

            window.location.href =
                "login.html";

            return;
        }


        if (!response.ok) {

            removeTyping();

            addMsg(
                "Server is unavailable right now. Please try again.",
                "bot"
            );

            return;
        }


        const data =
            await response.json();


        removeTyping();


        const reply =
            data.reply ||
            "No response received.";


        /* MAIN ANSWER */

        addMsg(
            reply,
            "bot"
        );


        /* LANGUAGE */

        if (data.language) {

            addInfo(
                "🌍 Language: " +
                data.language.toUpperCase()
            );
        }


        /* REFERENCE */

        if (data.reference) {

            addInfo(
                "📖 Reference: " +
                data.reference
            );
        }


        /* CONFIDENCE */

        if (data.confidence) {

            addInfo(
                "🎯 Confidence: " +
                data.confidence
            );
        }


        /* SOURCE */

        if (data.source) {

            addInfo(
                "📚 Source: " +
                data.source
            );
        }


        /* RELATED */

        showRelated(
            data.related_topics || []
        );


        /* VOICE */

        speakText(reply);


    } catch (error) {

        console.error(error);

        removeTyping();

        addMsg(
            "Network error. Please check your connection.",
            "bot"
        );
    }

    scrollBottom();
}


/* =========================
   RELATED TOPICS
========================= */

function showRelated(topics) {

    relatedBox.innerHTML = "";

    if (!topics ||
        topics.length === 0) {
        return;
    }


    const title =
        document.createElement("span");

    title.className =
        "related-title";

    title.innerText =
        "Related:";

    relatedBox.appendChild(title);


    topics.forEach(
        topic => {

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "related-btn";

            button.innerText =
                topic;


            button.onclick =
                () => {

                    input.value =
                        topic;

                    sendMessage();
                };


            relatedBox.appendChild(
                button
            );
        }
    );
}


/* =========================
   LOAD HISTORY
========================= */

async function loadHistory() {

    if (!token) {

        window.location.href =
            "login.html";

        return;
    }


    try {

        const response =
            await fetch(
                `${API_URL}/history`,
                {
                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        if (response.status === 401) {

            localStorage.removeItem(
                "token"
            );

            window.location.href =
                "login.html";

            return;
        }


        if (!response.ok) {
            return;
        }


        const data =
            await response.json();


        chatBox.innerHTML = "";


        if (
            !data.history ||
            data.history.length === 0
        ) {

            chatBox.innerHTML = `
                <div class="welcome" id="welcome">
                    <div class="welcome-icon">🕌</div>
                    <h3>Assalamu Alaikum</h3>
                    <p>
                        Ask me about Quran, Hadith,
                        Salah, Ramadan, Dua or
                        Islamic guidance.
                    </p>
                </div>
            `;

            return;
        }


        data.history.forEach(
            item => {

                addMsg(
                    item.question,
                    "user"
                );

                addMsg(
                    item.answer,
                    "bot"
                );
            }
        );


        scrollBottom();


    } catch (error) {

        console.error(
            "History error:",
            error
        );
    }
}


/* =========================
   CLEAR CHAT
========================= */

async function clearChat() {

    if (
        !confirm(
            "Clear your chat history?"
        )
    ) {
        return;
    }


    try {

        await fetch(
            `${API_URL}/clear`,
            {
                method: "DELETE",

                headers: {
                    "Authorization":
                        "Bearer " + token
                }
            }
        );


        chatBox.innerHTML = `
            <div class="welcome" id="welcome">
                <div class="welcome-icon">🕌</div>
                <h3>Assalamu Alaikum</h3>
                <p>
                    Your chat has been cleared.
                    Ask me anything about Islam.
                </p>
            </div>
        `;


        relatedBox.innerHTML = "";


    } catch (error) {

        addMsg(
            "Unable to clear chat.",
            "bot"
        );
    }
}


/* =========================
   ENTER KEY
========================= */

function handleEnter(event) {

    if (
        event.key === "Enter"
    ) {

        event.preventDefault();

        sendMessage();
    }
}


/* =========================
   VOICE INPUT
========================= */

function startVoice() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        alert(
            "Voice input is not supported in this browser."
        );

        return;
    }


    const recognition =
        new SpeechRecognition();


    recognition.lang =
        "en-US";


    recognition.interimResults =
        false;


    recognition.onresult =
        event => {

            input.value =
                event.results[0][0]
                    .transcript;

            sendMessage();
        };


    recognition.onerror =
        () => {

            console.log(
                "Voice recognition error"
            );
        };


    recognition.start();
}


/* =========================
   VOICE OUTPUT
========================= */

function speakText(text) {

    if (!text ||
        !window.speechSynthesis) {
        return;
    }


    window.speechSynthesis.cancel();


    const speech =
        new SpeechSynthesisUtterance(
            text
        );


    speech.lang =
        "en-US";


    speech.rate =
        0.95;


    window.speechSynthesis.speak(
        speech
    );
}


/* =========================
   DARK MODE
========================= */

function toggleTheme() {

    document.body.classList.toggle(
        "dark"
    );


    localStorage.setItem(
        "theme",
        document.body.classList.contains(
            "dark"
        )
            ? "dark"
            : "light"
    );
}


if (
    localStorage.getItem("theme")
    === "dark"
) {

    document.body.classList.add(
        "dark"
    );
}


/* =========================
   SCROLL
========================= */

function scrollBottom() {

    requestAnimationFrame(
        () => {

            chatBox.scrollTop =
                chatBox.scrollHeight;
        }
    );
}

</script>

</body>
</html>
