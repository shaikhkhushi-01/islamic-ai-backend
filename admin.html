<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel - Islamic AI</title>
    <meta charset="UTF-8">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #f4f6f9;
            margin: 0;
        }

        .container {
            max-width: 700px;
            margin: 50px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #2c3e50;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        textarea {
            resize: none;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: #2ecc71;
            color: white;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #27ae60;
        }

        .login-section {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .status {
            margin-top: 15px;
            font-weight: bold;
            color: #2c3e50;
            text-align: center;
        }

        .label {
            font-weight: 600;
            margin-top: 15px;
            display: block;
            color: #34495e;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>🛠 Admin Panel - Islamic AI</h2>

    <label class="label">Admin Password</label>
    <input type="password" id="adminPass" placeholder="Enter admin password">

    <label class="label">Add Islamic Knowledge</label>
    <textarea id="newText" rows="5" placeholder="Enter Islamic knowledge here..."></textarea>

    <button onclick="addData()">➕ Add Data</button>

    <p id="status" class="status"></p>

    <div class="login-section">

        <h3 style="text-align:center;">🔐 Admin Login</h3>

        <input type="text" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">

        <button onclick="login()">Login</button>

    </div>

</div>

<script>

async function addData() {

    const text = document.getElementById("newText").value;
    const password = document.getElementById("adminPass").value;
    const token = localStorage.getItem("token");

    if (!text || !password) {
        alert("Fill all fields");
        return;
    }

    if(!token){
        alert("Login first");
        return;
    }

    const response = await fetch("https://islamic-ai-backend-b4z6.onrender.com/admin/add", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded",
            "Authorization": "Bearer " + token
        },
        body: new URLSearchParams({
            topic: "custom",
            content: text,
            detailed: "",
            reference: ""
        })
    });

    if(response.status === 401){
        alert("Unauthorized - Token problem");
        return;
    }

    const data = await response.json();
    document.getElementById("status").innerText = data.message;
}

async function login(){

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if(!email || !password){
        alert("Enter email & password");
        return;
    }

    const formData = new URLSearchParams();
    formData.append("username", email);
    formData.append("password", password);

    const res = await fetch("https://islamic-ai-backend-b4z6.onrender.com/login",{
        method:"POST",
        headers:{
            "Content-Type":"application/x-www-form-urlencoded"
        },
        body: formData
    });

    const data = await res.json();

    if(res.status !== 200){
        alert("Login failed");
        return;
    }

    localStorage.setItem("token", data.access_token);

    alert("Login Successful");

    window.location.href = "index.html";
}

</script>

</body>
</html>
