<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel - Islamic AI</title>
    <meta charset="UTF-8">
</head>
<body style="font-family: Arial; padding: 40px;">

    <h2>🛠 Admin Panel - Add Islamic Knowledge</h2>

    <input type="password" id="adminPass" placeholder="Enter admin password">
    <br><br>

    <textarea id="newText" rows="5" cols="60" placeholder="Enter Islamic knowledge here..."></textarea>
    <br><br>

    <button onclick="addData()">Add Data</button>

    <p id="status"></p>

    <hr><br>

    <input type="text" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>

<script>

async function addData() {

    const text = document.getElementById("newText").value;
    const password = document.getElementById("adminPass").value;
    const token = localStorage.getItem("token");

    if (!text || !password) {
        alert("Fill all fields");
        return;
    }

    if(!token){
        alert("Login first");
        return;
    }

    const response = await fetch("https://islamic-ai-backend-b4z6.onrender.com/admin/add", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded",
            "Authorization": "Bearer " + token   // 🔥 THIS IS IMPORTANT
        },
        body: new URLSearchParams({
    topic: "custom",
    content: text,
    detailed: "",
    reference: ""
})
    });

    if(response.status === 401){
        alert("Unauthorized - Token problem");
        return;
    }

    const data = await response.json();
    document.getElementById("status").innerText = data.message;
}

async function login(){

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if(!email || !password){
        alert("Enter email & password");
        return;
    }

    const res = await fetch("https://islamic-ai-backend-b4z6.onrender.com/login",{
        method:"POST",
        headers:{
            "Content-Type":"application/x-www-form-urlencoded"
        },
        body:new URLSearchParams({
            username: email,
            password: password
        })
    });

    const data = await res.json();

    if(res.status !== 200){
        alert("Login failed");
        return;
    }

    // ✅ SAVE TOKEN FIRST
    localStorage.setItem("token", data.access_token);

    alert("Login Successful");

    // ✅ THEN REDIRECT
    window.location.href = "index.html";
}

</script>

</body>

</html>
