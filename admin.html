<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel - Islamic AI</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        *{box-sizing:border-box}
        body{
            margin:0;
            font-family:'Segoe UI',Tahoma,sans-serif;
            background:linear-gradient(rgba(15,61,62,.92),rgba(15,61,62,.92)),
            url('https://images.unsplash.com/photo-1542816417-0983670d1bb1?q=80&w=1200&auto=format&fit=crop') center/cover no-repeat;
            min-height:100vh;
            padding:20px;
        }

        .container{
            max-width:700px;
            margin:30px auto;
            background:#ffffff;
            padding:30px;
            border-radius:18px;
            box-shadow:0 10px 30px rgba(0,0,0,0.25);
        }

        h2,h3{
            text-align:center;
            color:#0f3d3e;
            margin-bottom:20px;
        }

        .label{
            font-weight:600;
            margin-top:15px;
            display:block;
            color:#34495e;
        }

        input, textarea{
            width:100%;
            padding:12px;
            margin-top:8px;
            border-radius:10px;
            border:1px solid #ccc;
            font-size:14px;
            outline:none;
        }

        textarea{
            resize:none;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:15px;
            border:none;
            border-radius:10px;
            background:#0f3d3e;
            color:white;
            font-size:15px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#14595a;
        }

        .secondary-btn{
            background:#2ecc71;
        }

        .secondary-btn:hover{
            background:#27ae60;
        }

        .danger-btn{
            background:#e74c3c;
        }

        .danger-btn:hover{
            background:#c0392b;
        }

        .login-section{
            margin-top:40px;
            padding-top:20px;
            border-top:1px solid #eee;
        }

        .status{
            margin-top:15px;
            font-weight:bold;
            text-align:center;
            color:#2c3e50;
            background:#ecf0f1;
            padding:10px;
            border-radius:8px;
        }

        .top-actions{
            display:flex;
            gap:10px;
            margin-top:15px;
        }

        .top-actions button{
            width:50%;
        }

        @media(max-width:600px){
            .top-actions{
                flex-direction:column;
            }
            .top-actions button{
                width:100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h2>🛠 Islamic AI Admin Panel</h2>

    <div class="top-actions">
        <button class="secondary-btn" onclick="goChat()">💬 Go to Chatbot</button>
        <button class="danger-btn" onclick="logout()">🚪 Logout</button>
    </div>

    <label class="label">Admin Password</label>
    <input type="password" id="adminPass" placeholder="Enter admin password">

    <label class="label">Topic</label>
    <input type="text" id="topic" placeholder="Enter topic (e.g. prayer, marriage)">

    <label class="label">Add Islamic Knowledge</label>
    <textarea id="newText" rows="6" placeholder="Enter Islamic knowledge here..."></textarea>

    <button onclick="addData()">➕ Add Knowledge</button>

    <p id="status" class="status">Ready</p>

    <div class="login-section">

        <h3>🔐 Admin Login</h3>

        <input type="text" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">

        <button onclick="login()">Login</button>

    </div>

</div>

<script>

async function addData() {
    const text = document.getElementById("newText").value;
    const topic = document.getElementById("topic").value;
    const password = document.getElementById("adminPass").value;
    const token = localStorage.getItem("token");

    if (!text || !password || !topic) {
        alert("Fill all fields");
        return;
    }

    if (!token) {
        alert("Login first");
        return;
    }

    document.getElementById("status").innerText = "Uploading...";

    const response = await fetch("https://islamic-ai-backend-b4z6.onrender.com/admin/add", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded",
            "Authorization": "Bearer " + token
        },
        body: new URLSearchParams({
            topic: topic,
            content: text,
            detailed: text,
            reference: ""
        })
    });

    const data = await response.json();

    if(response.status === 401){
        alert("Unauthorized - login again");
        return;
    }

    document.getElementById("status").innerText = data.message || "Added successfully";

    document.getElementById("topic").value = "";
    document.getElementById("newText").value = "";
}

async function login() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if(!email || !password){
        alert("Enter email & password");
        return;
    }

    const formData = new URLSearchParams();
    formData.append("username", email);
    formData.append("password", password);

    const res = await fetch("https://islamic-ai-backend-b4z6.onrender.com/login",{
        method:"POST",
        headers:{
            "Content-Type":"application/x-www-form-urlencoded"
        },
        body: formData
    });

    const data = await res.json();

    if(res.status !== 200){
        alert("Login failed");
        return;
    }

    localStorage.setItem("token", data.access_token);
    alert("Login Successful");
    document.getElementById("status").innerText = "Admin logged in";
}

function goChat(){
    window.location.href = "index.html";
}

function logout(){
    localStorage.removeItem("token");
    alert("Logged out");
    location.reload();
}

</script>

</body>
</html>
